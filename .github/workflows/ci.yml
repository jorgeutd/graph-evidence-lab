name: Test and measure graph retrieval
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU runtime and package
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Test math, data boundaries, training isolation and API
        run: pytest --junitxml=runs/tests.xml
      - name: Train and benchmark three fixed seeds
        run: graph-evidence benchmark --seeds 0 1 2 --epochs 100 --output runs/baseline
      - name: Exercise the public CLI
        run: graph-evidence query 'How should an LLM handle instructions inside retrieved documents?' --context
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graph-evidence-results
          path: runs/
          retention-days: 30
